name: Android offline APK
on:
  push:
    branches: [main, feat/android-offline-pos]
    paths: ['native/android/**', '.github/workflows/android-offline.yml']
  pull_request:
    paths: ['native/android/**', '.github/workflows/android-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test ledger and build APK
        working-directory: native/android
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            native/android/app/build/reports/tests/
            native/android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: JusMerdeka-offline-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
