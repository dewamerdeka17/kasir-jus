plugins { id "com.android.application" }

android {
    namespace "com.jusmerdeka.pos"
    compileSdk 36

    defaultConfig {
        applicationId "com.jusmerdeka.pos"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "APP_URL", '"https://jus-merdeka-jumbo-pos.vercel.app"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { applicationIdSuffix ".debug"; versionNameSuffix "-debug" }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" }
    }
}
